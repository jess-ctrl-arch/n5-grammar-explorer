<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>にほんご N5 Grammar Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500&family=DM+Sans:ital,wght@0,400;0,500;1,400&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAFAF7;--surface:#fff;--surface2:#F5F4F0;--surface3:#EEEDEA;
  --border:rgba(0,0,0,.09);--border-m:rgba(0,0,0,.16);
  --text:#17171A;--text2:#52525C;--text3:#9898A8;
  --red:#C53030;--red-bg:#FEF2F2;--red-bd:#FECACA;--red-dk:#991B1B;
  --blue:#1D4ED8;--blue-bg:#EFF6FF;--blue-bd:#BFDBFE;
  --green:#15803D;--green-bg:#F0FDF4;--green-bd:#86EFAC;
  --amber:#B45309;--amber-bg:#FFFBEB;--amber-bd:#FDE68A;
  --purple:#6D28D9;--purple-bg:#F5F3FF;--purple-bd:#DDD6FE;
  --r:10px;--rl:14px;--sidebar:268px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-size:15px}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
.jp{font-family:'Noto Sans JP',sans-serif}
button{font-family:'DM Sans',sans-serif;cursor:pointer}
a{color:var(--blue)}

.shell{display:flex;flex-direction:column;height:100vh;overflow:hidden}
.topbar{flex-shrink:0;height:58px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 1.5rem;z-index:50}
.logo{display:flex;align-items:center;gap:10px}
.logo-mark{width:36px;height:36px;background:var(--red);border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Noto Sans JP',sans-serif;font-size:17px;font-weight:500;flex-shrink:0}
.logo-text{font-family:'Fraunces',serif;font-size:18px;font-weight:500;line-height:1.2}
.logo-sub{font-size:11px;color:var(--text3)}
.body{display:flex;flex:1;overflow:hidden}
.sidebar{width:var(--sidebar);flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);overflow-y:auto}
.sidebar::-webkit-scrollbar{width:3px}
.sidebar::-webkit-scrollbar-thumb{background:var(--border-m);border-radius:2px}
.sb-section{padding:0 0 4px}
.sb-cat{font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);padding:13px 16px 4px}
.sb-btn{display:flex;align-items:center;gap:8px;width:100%;padding:5px 16px;background:none;border:none;text-align:left;font-size:13px;color:var(--text2);transition:background .1s,color .1s}
.sb-btn:hover{background:var(--surface2);color:var(--text)}
.sb-btn.on{background:var(--red-bg);color:var(--red);font-weight:500}
.sb-jp{font-family:'Noto Sans JP',sans-serif;font-size:12.5px;min-width:58px}
.sb-en{font-size:12px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag-pill{font-size:10px;padding:1px 6px;border-radius:5px;white-space:nowrap;margin-left:auto;font-weight:400}
.done-badge{display:inline-flex;align-items:center;background:var(--green-bg);border:1px solid var(--green-bd);border-radius:5px;font-size:10px;color:var(--green);padding:1px 6px;margin-left:auto}
.main{flex:1;overflow-y:auto;padding:1.75rem}
.main::-webkit-scrollbar{width:5px}
.main::-webkit-scrollbar-thumb{background:var(--border-m);border-radius:2px}

/* Welcome */
.welcome{max-width:560px;margin:2.5rem auto;text-align:center;padding:0 1rem}
.welcome-kanji{font-family:'Noto Sans JP',sans-serif;font-size:80px;line-height:1;color:var(--red);opacity:.07;margin-bottom:1rem;user-select:none}
.welcome h1{font-family:'Fraunces',serif;font-size:28px;font-weight:500;margin-bottom:.6rem}
.welcome p{font-size:14.5px;color:var(--text2);line-height:1.7;margin-bottom:1.5rem}
.feat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:1.5rem}
.feat{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:1rem;text-align:center}
.feat-icon{width:34px;height:34px;border-radius:8px;margin:0 auto 9px;display:flex;align-items:center;justify-content:center;font-size:16px}
.feat h3{font-size:13px;font-weight:500;margin-bottom:2px}
.feat p{font-size:11.5px;color:var(--text3);line-height:1.5}
.source-note{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px 16px;font-size:13px;color:var(--text2);text-align:left;line-height:1.65}
.source-note strong{font-weight:500;color:var(--text)}

/* Topic header */
.topic-hd{margin-bottom:1.25rem}
.topic-breadcrumb{font-size:12px;color:var(--text3);margin-bottom:4px}
.topic-title{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-family:'Fraunces',serif;font-size:24px;font-weight:500;margin-bottom:2px}
.topic-jp{font-family:'Noto Sans JP',sans-serif;font-size:19px;font-weight:400;color:var(--red)}
.topic-src{font-size:11.5px;color:var(--text3);margin-top:2px}

/* Mode tabs */
.mode-tabs{display:flex;gap:3px;background:var(--surface2);border-radius:var(--r);padding:4px;width:fit-content;margin-bottom:1.25rem}
.mode-tab{display:flex;align-items:center;gap:6px;padding:7px 16px;border-radius:7px;border:none;background:none;font-size:13px;font-weight:500;color:var(--text2);transition:background .15s,color .15s}
.mode-tab:hover{color:var(--text)}
.mode-tab.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.mode-tab svg{width:13px;height:13px;flex-shrink:0}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:8px;border:1px solid var(--border-m);background:var(--surface);font-size:13px;font-weight:500;color:var(--text2);transition:background .15s}
.btn:hover{background:var(--surface2)}
.btn-red{background:var(--red);border-color:var(--red);color:#fff}
.btn-red:hover{background:var(--red-dk);border-color:var(--red-dk)}
.btn-sm{padding:5px 11px;font-size:12px}

/* Speak */
.spk{display:inline-flex;align-items:center;justify-content:center;width:27px;height:27px;border-radius:50%;border:1px solid var(--border-m);background:var(--surface);color:var(--text2);font-size:10px;transition:background .15s;flex-shrink:0}
.spk:hover{background:var(--surface2)}
.spk.on{background:var(--blue-bg);border-color:var(--blue-bd);color:var(--blue)}

/* Loading */
.loading{display:flex;flex-direction:column;align-items:center;gap:10px;padding:3.5rem 2rem}
.ld-dots{display:flex;gap:6px}
.ld-dot{width:7px;height:7px;border-radius:50%;background:var(--red);animation:ldp 1.2s ease infinite}
.ld-dot:nth-child(2){animation-delay:.2s}
.ld-dot:nth-child(3){animation-delay:.4s}
@keyframes ldp{0%,80%,100%{opacity:.25;transform:scale(.7)}40%{opacity:1;transform:scale(1)}}
.ld-msg{font-size:13px;color:var(--text3)}
.err-box{background:var(--red-bg);border:1px solid var(--red-bd);border-radius:var(--r);padding:12px 16px;font-size:13.5px;color:var(--red-dk)}

/* Learn */
.pattern-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:1.25rem 1.5rem;margin-bottom:1rem}
.box-label{font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);margin-bottom:7px}
.formula{font-family:'DM Mono','Courier New',monospace;font-size:14px;background:var(--surface2);padding:7px 12px;border-radius:7px;margin-bottom:9px;color:var(--text)}
.expl{font-size:13.5px;color:var(--text2);line-height:1.7;margin-bottom:9px}
.tip{background:var(--blue-bg);border:1px solid var(--blue-bd);border-radius:8px;padding:8px 12px;font-size:13px;color:var(--blue);margin-bottom:5px;line-height:1.55}
.warn{background:var(--amber-bg);border:1px solid var(--amber-bd);border-radius:8px;padding:8px 12px;font-size:13px;color:var(--amber);margin-top:5px;line-height:1.55}
.sec-label{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);margin:1.1rem 0 .6rem}
.ex-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:.9rem 1.1rem;margin-bottom:8px}
.ex-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:5px}
.ex-jp{font-family:'Noto Sans JP',sans-serif;font-size:21px;line-height:1.9}
.ex-rd{font-size:12px;color:var(--text3);margin-bottom:3px}
.ex-en{font-size:13px;color:var(--text2);font-style:italic;margin-bottom:8px}
.ex-bd{display:flex;flex-wrap:wrap;gap:5px;padding-top:8px;border-top:1px solid var(--border)}
.bd-chip{border:1px solid var(--border-m);border-radius:6px;padding:3px 8px;font-size:12px}
.bd-jp{font-family:'Noto Sans JP',sans-serif;font-size:13px;display:block;line-height:1.5}
.bd-role{font-size:10px;color:var(--text3)}
.bd-chip.r-particle{background:var(--amber-bg);border-color:var(--amber-bd)}
.bd-chip.r-particle .bd-role{color:var(--amber)}
.bd-chip.r-verb{background:var(--green-bg);border-color:var(--green-bd)}
.bd-chip.r-verb .bd-role{color:var(--green)}
.bd-chip.r-noun,.bd-chip.r-subject,.bd-chip.r-object{background:var(--blue-bg);border-color:var(--blue-bd)}
.bd-chip.r-noun .bd-role,.bd-chip.r-subject .bd-role,.bd-chip.r-object .bd-role{color:var(--blue)}
.bd-chip.r-grammar{background:var(--red-bg);border-color:var(--red-bd)}
.bd-chip.r-grammar .bd-role{color:var(--red)}
.bd-chip.r-adjective{background:var(--purple-bg);border-color:var(--purple-bd)}
.bd-chip.r-adjective .bd-role{color:var(--purple)}

/* Quiz */
.quiz-stat{font-size:13.5px;font-weight:500;margin-bottom:.9rem}
.quiz-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:1.4rem;margin-bottom:.9rem;text-align:center}
.quiz-prompt{font-size:12px;color:var(--text3);margin-bottom:.6rem}
.quiz-sent{font-family:'Noto Sans JP',sans-serif;font-size:24px;line-height:1.9;margin-bottom:5px}
.blank{display:inline-block;min-width:60px;border-bottom:2px solid var(--red);vertical-align:bottom;height:32px;line-height:32px;text-align:center;padding:0 6px;font-family:'Noto Sans JP',sans-serif;font-size:20px;transition:border-color .2s,color .2s}
.blank.ok{border-color:var(--green);color:var(--green)}
.blank.ng{border-color:var(--red);color:var(--red)}
.quiz-rd{font-size:11.5px;color:var(--text3);margin-bottom:3px}
.quiz-en{font-size:13px;color:var(--text2);font-style:italic}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:.9rem}
.choice{background:var(--surface);border:1px solid var(--border-m);border-radius:var(--r);padding:10px 8px;font-family:'Noto Sans JP',sans-serif;font-size:17px;display:flex;align-items:center;justify-content:space-between;gap:5px;transition:background .1s}
.choice:hover:not(:disabled){background:var(--surface2)}
.choice.ok{background:var(--green-bg);border-color:var(--green-bd);color:var(--green)}
.choice.ng{background:var(--red-bg);border-color:var(--red-bd);color:var(--red-dk)}
.choice-txt{flex:1;text-align:center}
.quiz-fb{padding:11px 14px;border-radius:var(--r);font-size:13px;line-height:1.65;margin-bottom:.9rem;display:none}
.quiz-fb.show{display:block}
.quiz-fb.ok{background:var(--green-bg);color:#166534;border:1px solid var(--green-bd)}
.quiz-fb.ng{background:var(--red-bg);color:var(--red-dk);border:1px solid var(--red-bd)}

/* Build */
.build-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:1.1rem 1.4rem;margin-bottom:.9rem}
.build-en{font-size:18px;font-weight:500;margin-bottom:3px}
.build-hint{font-size:13px;color:var(--text2)}
.ans-zone{min-height:52px;border:1.5px dashed var(--border-m);border-radius:var(--r);padding:9px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:9px;background:var(--surface);transition:border-color .2s,background .2s}
.ans-zone.ok{border-style:solid;border-color:var(--green);background:var(--green-bg)}
.ans-zone.ng{border-style:solid;border-color:var(--red)}
.ans-ph{font-size:13px;color:var(--text3)}
.tile{background:var(--surface);border:1px solid var(--border-m);border-radius:8px;padding:5px 12px;font-family:'Noto Sans JP',sans-serif;font-size:15px;user-select:none;transition:transform .1s,opacity .15s,border-color .15s}
.tile:hover:not(.used){transform:translateY(-2px);border-color:var(--text)}
.tile.in-ans{background:var(--blue-bg);border-color:var(--blue-bd);color:var(--blue)}
.tile.used{opacity:.18;pointer-events:none}
.word-bank{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:.9rem}
.build-actions{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.build-fb{padding:11px 14px;border-radius:var(--r);font-size:13px;line-height:1.65;margin-top:9px}
.build-fb.ok{background:var(--green-bg);color:#166534;border:1px solid var(--green-bd)}
.build-fb.ng{background:var(--red-bg);color:var(--red-dk);border:1px solid var(--red-bd)}

/* Mobile */
.menu-btn{display:none;align-items:center;justify-content:center;width:34px;height:34px;border:1px solid var(--border-m);border-radius:8px;background:var(--surface);font-size:17px}
@media(max-width:768px){
  .sidebar{display:none;position:fixed;top:58px;left:0;bottom:0;z-index:100;box-shadow:2px 0 12px rgba(0,0,0,.1)}
  .sidebar.open{display:block}
  .menu-btn{display:flex}
  .main{padding:1rem}
  .choices{grid-template-columns:1fr}
  .feat-grid{grid-template-columns:1fr}
  :root{--sidebar:240px}
}
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div style="display:flex;align-items:center;gap:10px">
      <button class="menu-btn" onclick="toggleSidebar()">☰</button>
      <div class="logo">
        <div class="logo-mark">日</div>
        <div>
          <div class="logo-text">N5 Grammar Explorer</div>
          <div class="logo-sub">JLPT N5 · Tae Kim + Tatoeba (CC)</div>
        </div>
      </div>
    </div>
    <div id="progressSummary" style="font-size:12px;color:var(--text3)"></div>
  </header>
  <div class="body">
    <nav class="sidebar" id="sidebar"></nav>
    <main class="main" id="main"></main>
  </div>
</div>
<script>
// ─────────────────────────────────────────
// HARDCODED LEARN DATA
// Sources:
//  • Tae Kim's Guide to Japanese Grammar (freely available, no licence restrictions on example sentences)
//  • Tatoeba Project (CC BY 2.0 FR) — tatoeba.org
// ─────────────────────────────────────────
const LEARN_DATA = {
  desu_masu:{
    pattern:"[noun / adjective] + です  |  [verb stem] + ます",
    explanation:"です and ます make sentences polite. です follows nouns and adjectives; ます is the polite ending for verbs. They are the foundation of everyday spoken Japanese.",
    tips:["Use です／ます in all formal situations, with strangers, and in class.","The plain (casual) form drops these endings — learn polite first, casual later."],
    common_mistake:"Adding です after a ます-verb: ✗ 食べますです → ✓ 食べます",
    examples:[
      {japanese:"わたしは学生です。",reading:"Watashi wa gakusei desu.",english:"I am a student.",
       breakdown:[{word:"わたしは",reading:"watashi wa",role:"subject",meaning:"I (topic)"},{word:"学生",reading:"gakusei",role:"noun",meaning:"student"},{word:"です",reading:"desu",role:"grammar",meaning:"polite copula"}]},
      {japanese:"まいにち日本語を勉強します。",reading:"Mainichi Nihongo o benkyou shimasu.",english:"I study Japanese every day.",
       breakdown:[{word:"まいにち",reading:"mainichi",role:"noun",meaning:"every day"},{word:"日本語を",reading:"Nihongo o",role:"object",meaning:"Japanese (object)"},{word:"勉強します",reading:"benkyou shimasu",role:"verb",meaning:"study (polite)"}]},
      {japanese:"あのレストランはおいしいです。",reading:"Ano resutoran wa oishii desu.",english:"That restaurant is delicious.",
       breakdown:[{word:"あのレストランは",reading:"ano resutoran wa",role:"subject",meaning:"that restaurant (topic)"},{word:"おいしい",reading:"oishii",role:"adjective",meaning:"delicious"},{word:"です",reading:"desu",role:"grammar",meaning:"polite copula"}]},
    ]
  },
  ka_q:{
    pattern:"[sentence] + か",
    explanation:"Adding か to the end of a statement turns it into a yes/no question. Japanese questions use the same word order as statements — no inversion needed.",
    tips:["In formal speech, keep a rising intonation with か.","In casual speech, か can be dropped and replaced by rising intonation alone."],
    common_mistake:"Inverting word order like English: ✗ ですあなたは学生？ → ✓ あなたは学生ですか。",
    examples:[
      {japanese:"これは本ですか。",reading:"Kore wa hon desu ka.",english:"Is this a book?",
       breakdown:[{word:"これは",reading:"kore wa",role:"subject",meaning:"this (topic)"},{word:"本",reading:"hon",role:"noun",meaning:"book"},{word:"ですか",reading:"desu ka",role:"grammar",meaning:"polite question"}]},
      {japanese:"日本語を話しますか。",reading:"Nihongo o hanashimasu ka.",english:"Do you speak Japanese?",
       breakdown:[{word:"日本語を",reading:"Nihongo o",role:"object",meaning:"Japanese (object)"},{word:"話します",reading:"hanashimasu",role:"verb",meaning:"speak (polite)"},{word:"か",reading:"ka",role:"grammar",meaning:"question marker"}]},
      {japanese:"あなたはがくせいですか。",reading:"Anata wa gakusei desu ka.",english:"Are you a student?",
       breakdown:[{word:"あなたは",reading:"anata wa",role:"subject",meaning:"you (topic)"},{word:"がくせい",reading:"gakusei",role:"noun",meaning:"student"},{word:"ですか",reading:"desu ka",role:"grammar",meaning:"polite question"}]},
    ]
  },
  ne_yo:{
    pattern:"[sentence] + ね (seeking agreement)  |  [sentence] + よ (asserting)",
    explanation:"ね seeks confirmation or shared feeling — like 'right?' or 'isn't it?'. よ asserts new information the speaker is confident about — like 'I'm telling you' or 'you know'.",
    tips:["ね is softer and invites the listener to agree; overusing よ can sound pushy.","Both are sentence-final particles and come after です／ます."],
    common_mistake:"Using よ when you want agreement: ✗ 寒いよ (just asserting) → ✓ 寒いね (seeking agreement: 'cold, isn't it?')",
    examples:[
      {japanese:"今日はいい天気ですね。",reading:"Kyou wa ii tenki desu ne.",english:"The weather is nice today, isn't it?",
       breakdown:[{word:"今日は",reading:"kyou wa",role:"subject",meaning:"today (topic)"},{word:"いい天気",reading:"ii tenki",role:"noun",meaning:"nice weather"},{word:"ですね",reading:"desu ne",role:"grammar",meaning:"isn't it? (seeking agreement)"}]},
      {japanese:"これはむずかしいですよ。",reading:"Kore wa muzukashii desu yo.",english:"This is difficult, I tell you.",
       breakdown:[{word:"これは",reading:"kore wa",role:"subject",meaning:"this (topic)"},{word:"むずかしい",reading:"muzukashii",role:"adjective",meaning:"difficult"},{word:"ですよ",reading:"desu yo",role:"grammar",meaning:"assertive よ"}]},
      {japanese:"あのえいがはおもしろかったですね。",reading:"Ano eiga wa omoshirokatta desu ne.",english:"That movie was interesting, wasn't it?",
       breakdown:[{word:"あのえいがは",reading:"ano eiga wa",role:"subject",meaning:"that movie (topic)"},{word:"おもしろかった",reading:"omoshirokatta",role:"adjective",meaning:"was interesting"},{word:"ですね",reading:"desu ne",role:"grammar",meaning:"wasn't it?"}]},
    ]
  },
  wa:{
    pattern:"[topic] + は + [comment]",
    explanation:"は marks the topic of the sentence — what the sentence is about. It sets the stage and is often translated as 'as for'. The topic can be the subject, object, or any element being highlighted.",
    tips:["は can shift focus: 魚は食べます means 'As for fish, I eat (it)' — implying other things may not be eaten.","は often replaces が or を when that element becomes the topic."],
    common_mistake:"Confusing は with が. は sets a topic for the whole conversation; が identifies a specific subject in a single clause.",
    examples:[
      {japanese:"わたしは田中です。",reading:"Watashi wa Tanaka desu.",english:"I am Tanaka. (As for me, I am Tanaka.)",
       breakdown:[{word:"わたしは",reading:"watashi wa",role:"subject",meaning:"I (topic)"},{word:"田中",reading:"Tanaka",role:"noun",meaning:"Tanaka (name)"},{word:"です",reading:"desu",role:"grammar",meaning:"copula"}]},
      {japanese:"東京は大きいです。",reading:"Toukyou wa ookii desu.",english:"Tokyo is big.",
       breakdown:[{word:"東京は",reading:"Toukyou wa",role:"subject",meaning:"Tokyo (topic)"},{word:"大きい",reading:"ookii",role:"adjective",meaning:"big"},{word:"です",reading:"desu",role:"grammar",meaning:"copula"}]},
      {japanese:"わたしはコーヒーはのみません。",reading:"Watashi wa koohii wa nomimasen.",english:"As for me, I don't drink coffee.",
       breakdown:[{word:"わたしは",reading:"watashi wa",role:"subject",meaning:"I (topic)"},{word:"コーヒーは",reading:"koohii wa",role:"object",meaning:"coffee (contrasted topic)"},{word:"のみません",reading:"nomimasen",role:"verb",meaning:"don't drink"}]},
    ]
  },
  ga:{

      {japanese:"ねる前にはをみがきます。",reading:"Neru mae ni ha o migakimasu.",english:"I brush my teeth before going to sleep.",
       breakdown:[{word:"ねる前に",reading:"neru mae ni",role:"grammar",meaning:"before sleeping (dictionary + 前に)"},{word:"はを",reading:"ha o",role:"object",meaning:"teeth"},{word:"みがきます",reading:"migakimasu",role:"verb",meaning:"brush (polite)"}]},
      {japanese:"しゅくだいをしたあとで、テレビをみます。",reading:"Shukudai o shita ato de, terebi o mimasu.",english:"After doing homework, I watch TV.",
       breakdown:[{word:"しゅくだいをしたあとで",reading:"shukudai o shita ato de",role:"grammar",meaning:"after doing homework (た-form + 後で)"},{word:"テレビを",reading:"terebi o",role:"object",meaning:"TV"},{word:"みます",reading:"mimasu",role:"verb",meaning:"watch"}]},
      {japanese:"食事の前に、てをあらってください。",reading:"Shokuji no mae ni, te o aratte kudasai.",english:"Please wash your hands before the meal.",
       breakdown:[{word:"食事の前に",reading:"shokuji no mae ni",role:"grammar",meaning:"before the meal (noun + の前に)"},{word:"てをあらって",reading:"te o aratte",role:"verb",meaning:"wash hands (て-form)"},{word:"ください",reading:"kudasai",role:"grammar",meaning:"please"}]},
    ]
  },
};

// ─────────────────────────────────────────
// TOPIC LIST
// ─────────────────────────────────────────
const TOPICS = [
  {cat:'Sentence Basics',tag:'core',items:[

  ]},

  ]},
];

const TAG_STYLE={core:'background:#F0FDFA;color:#0F766E',particle:'background:#FFFBEB;color:#B45309',verb:'background:#F0FDF4;color:#15803D',adj:'background:#F5F3FF;color:#6D28D9',pattern:'background:#FEF2F2;color:#991B1B'};
const ROLE_CLS={particle:'r-particle',verb:'r-verb',grammar:'r-grammar',noun:'r-noun',subject:'r-subject',object:'r-object',adjective:'r-adjective'};

let curTopic=null,curMode='learn';
let completedTopics=JSON.parse(localStorage.getItem('n5_done')||'[]');
let qz={data:null,done:false,score:0,total:0,chosen:-1,right:false};
let bd={data:null,tiles:[],ans:[],checked:false,correct:false};
let jpVoice=null;

if(typeof speechSynthesis!=='undefined'){
  const lv=()=>{const vs=speechSynthesis.getVoices();jpVoice=vs.find(v=>v.lang==='ja-JP')||vs.find(v=>v.lang.startsWith('ja'))||null;};
  lv();speechSynthesis.onvoiceschanged=lv;
}
function speak(text,bid,e){
  if(e)e.stopPropagation();
  if(typeof speechSynthesis==='undefined')return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='ja-JP';if(jpVoice)u.voice=jpVoice;u.rate=0.85;
  if(bid){const b=document.getElementById(bid);if(b){b.classList.add('on');u.onend=u.onerror=()=>b.classList.remove('on');}}
  speechSynthesis.speak(u);
}
function spk(text,id){return`<button class="spk" id="${id}" onclick="speak('${text.replace(/'/g,"\\'")}','${id}',event)" title="Listen">▶</button>`;}

async function callAI(system,user){
  const res=await fetch('/.netlify/functions/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1800,system,messages:[{role:'user',content:user}]})});
  const d=await res.json();
  if(d.error)throw new Error(d.error.message||d.error);
  const txt=d.content.map(b=>b.text||'').join('');
  return JSON.parse(txt.replace(/```json\n?|```\n?/g,'').trim());
}

const SYS_QUIZ=`You are a Japanese language teacher writing JLPT N5 quiz questions for beginners. Return ONLY valid JSON — no markdown, no extra text.
Schema: {"japanese":"sentence with ___ for blank","reading":"reading with ___","english":"English translation","choices":["a","b","c","d"],"correct_index":0,"explanation":"Why correct; why others wrong."}
4 plausible choices, one correct. Short choices (1-5 chars). N5 only.`;

const SYS_BUILD=`You are a Japanese language teacher creating sentence-building exercises for JLPT N5. Return ONLY valid JSON — no markdown, no extra text.
Schema: {"english":"English to translate","hint":"grammar structure hint","tiles":[{"id":0,"jp":"word","reading":"reading","is_distractor":false}],"correct_order":[0,2,1],"full_japanese":"complete sentence","reading":"full reading","explanation":"brief grammar note"}
6-8 tiles, exactly 2 distractors (is_distractor:true). correct_order lists non-distractor ids in correct sequence. N5 only.`;

function getTopicInfo(id){for(const cat of TOPICS){const t=cat.items.find(x=>x.id===id);if(t)return{...t,cat:cat.cat,tag:cat.tag};}}
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open');}

function buildSidebar(){
  const total=TOPICS.reduce((n,c)=>n+c.items.length,0);
  document.getElementById('sidebar').innerHTML=TOPICS.map(cat=>`
    <div class="sb-section">
      <div class="sb-cat">${cat.cat}</div>
      ${cat.items.map(t=>{
        const done=completedTopics.includes(t.id);
        return`<button class="sb-btn ${curTopic===t.id?'on':''}" onclick="pickTopic('${t.id}')">
          <span class="sb-jp">${t.jp}</span>
          <span class="sb-en">${t.en.split('—')[0].split('(')[0].trim()}</span>
          ${done?`<span class="done-badge">✓</span>`:`<span class="tag-pill" style="${TAG_STYLE[cat.tag]}">${cat.tag}</span>`}
        </button>`;
      }).join('')}
    </div>`).join('');
  document.getElementById('progressSummary').textContent=`${completedTopics.length} / ${total} done`;
}

function showWelcome(){
  document.getElementById('main').innerHTML=`
    <div class="welcome">
      <div class="welcome-kanji">語</div>
      <h1>N5 Grammar Explorer</h1>
      <p>Study all JLPT N5 grammar points with curated examples from <strong>Tae Kim's Grammar Guide</strong> and the <strong>Tatoeba Project</strong> (CC BY 2.0), plus AI-powered quizzes and sentence-building exercises.</p>
      <div class="feat-grid">
        <div class="feat"><div class="feat-icon" style="background:var(--blue-bg)">📖</div><h3>Learn</h3><p>Curated examples with audio, readings & word breakdowns</p></div>
        <div class="feat"><div class="feat-icon" style="background:var(--amber-bg)">❓</div><h3>Quiz</h3><p>AI fill-in-the-blank questions with instant feedback</p></div>
        <div class="feat"><div class="feat-icon" style="background:var(--green-bg)">🔨</div><h3>Build</h3><p>Tap word tiles to assemble correct sentences</p></div>
      </div>
      <div class="source-note">
        <strong>Example sources:</strong> Learn mode uses hand-curated sentences from
        <a href="https://guidetojapanese.org" target="_blank">Tae Kim's Guide to Japanese Grammar</a> and the
        <a href="https://tatoeba.org" target="_blank">Tatoeba Project</a> (CC BY 2.0 FR).
        Quiz and Build modes use AI-generated content. ← Select a topic from the sidebar to begin.
      </div>
    </div>`;
}

function pickTopic(id){
  curTopic=id;curMode='learn';
  qz={data:null,done:false,score:qz.score,total:qz.total,chosen:-1,right:false};
  bd={data:null,tiles:[],ans:[],checked:false,correct:false};
  if(window.innerWidth<=768)document.getElementById('sidebar').classList.remove('open');
  buildSidebar();renderShell();renderLearn();
}

function renderShell(){
  const t=getTopicInfo(curTopic);
  const enPart=t.en.split('(')[0].split('—')[0].trim();
  document.getElementById('main').innerHTML=`
    <div class="topic-hd">
      <div class="topic-breadcrumb">${t.cat}</div>
      <div class="topic-title">${enPart}<span class="topic-jp">${t.jp}</span></div>
      <div class="topic-src">Learn: Tae Kim + Tatoeba (CC) · Quiz & Build: AI-generated</div>
    </div>
    <div class="mode-tabs">
      <button class="mode-tab on" id="tab-learn" onclick="switchMode('learn')">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 3h12M2 6h8M2 9h10M2 12h6"/></svg>Learn
      </button>
      <button class="mode-tab" id="tab-quiz" onclick="switchMode('quiz')">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6"/><path d="M8 5.5c0-1 .8-1.5 1.5-1.5S11 4.5 11 5.5c0 1-.8 1.5-1.5 1.5H8v1"/><circle cx="8" cy="10.5" r=".75" fill="currentColor"/></svg>Quiz
      </button>
      <button class="mode-tab" id="tab-build" onclick="switchMode('build')">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="9" width="4" height="5" rx="1"/><rect x="6" y="6" width="4" height="8" rx="1"/><rect x="11" y="3" width="4" height="11" rx="1"/></svg>Build
      </button>
    </div>
    <div id="mc"></div>`;
}

function switchMode(m){
  curMode=m;
  ['learn','quiz','build'].forEach(x=>document.getElementById('tab-'+x)?.classList.toggle('on',x===m));
  if(m==='learn')renderLearn();
  else if(m==='quiz'){qz={data:null,done:false,chosen:-1,right:false,score:qz.score,total:qz.total};loadAI('quiz');}
  else{bd={data:null,tiles:[],ans:[],checked:false,correct:false};loadAI('build');}
}

function renderLearn(){
  const mc=document.getElementById('mc');if(!mc)return;
  const d=LEARN_DATA[curTopic];
  if(!d){mc.innerHTML=`<div class="err-box">No learn data for this topic yet.</div>`;return;}
  markDone(curTopic);
  const exHtml=d.examples.map((ex,i)=>`
    <div class="ex-card">
      <div class="ex-top">
        <div>
          <div class="ex-jp jp">${ex.japanese}</div>
          <div class="ex-rd">${ex.reading}</div>
          <div class="ex-en">${ex.english}</div>
        </div>
        ${spk(ex.japanese,`spk-ex${i}`)}
      </div>
      <div class="ex-bd">${ex.breakdown.map(b=>`
        <div class="bd-chip ${ROLE_CLS[b.role]||''}">
          <span class="bd-jp">${b.word}</span>
          <span class="bd-role">${b.role} · ${b.meaning}</span>
        </div>`).join('')}
      </div>
    </div>`).join('');
  mc.innerHTML=`
    <div class="pattern-box">
      <div class="box-label">Pattern</div>
      <div class="formula">${d.pattern}</div>
      <div class="expl">${d.explanation}</div>
      ${d.tips.map(t=>`<div class="tip">💡 ${t}</div>`).join('')}
      ${d.common_mistake?`<div class="warn">⚠ Common mistake: ${d.common_mistake}</div>`:''}
    </div>
    <div class="sec-label">Curated examples</div>
    ${exHtml}
    <div style="margin-top:1rem;display:flex;gap:7px;flex-wrap:wrap">
      <button class="btn btn-sm btn-red" onclick="switchMode('quiz')">Take quiz →</button>
      <button class="btn btn-sm" onclick="switchMode('build')">Try Build →</button>
    </div>`;
}

async function loadAI(mode){
  const mc=document.getElementById('mc');if(!mc)return;
  if(mode==='quiz'&&qz.data){renderQuiz();return;}
  if(mode==='build'&&bd.data){renderBuild();return;}
  const msgs={quiz:'Generating quiz question…',build:'Building exercise…'};
  mc.innerHTML=`<div class="loading"><div class="ld-dots"><div class="ld-dot"></div><div class="ld-dot"></div><div class="ld-dot"></div></div><div class="ld-msg">${msgs[mode]}</div></div>`;
  const t=getTopicInfo(curTopic);
  try{
    if(mode==='quiz'){
      const data=await callAI(SYS_QUIZ,`Create a fill-in-blank question for: ${t.en} [${t.jp}]. N5 level.`);
      qz.data=data;renderQuiz();
    } else {
      const data=await callAI(SYS_BUILD,`Sentence-building exercise for: ${t.en} [${t.jp}]. N5 level.`);
      bd.data=data;bd.tiles=data.tiles.map(x=>({...x,used:false}));bd.ans=[];bd.checked=false;bd.correct=false;renderBuild();
    }
  }catch(err){
    mc.innerHTML=`<div class="err-box">⚠ ${err.message} <button class="btn btn-sm" style="margin-left:8px" onclick="loadAI('${mode}')">Try again</button></div>`;
  }
}

function markDone(id){
  if(!completedTopics.includes(id)){completedTopics.push(id);localStorage.setItem('n5_done',JSON.stringify(completedTopics));buildSidebar();}
}

function renderQuiz(){
  const mc=document.getElementById('mc');if(!mc)return;
  const d=qz.data;
  const sentHtml=d.japanese.replace('___',`<span class="blank ${qz.done?(qz.right?'ok':'ng'):''}" id="qblank">${qz.done?d.choices[d.correct_index]:'\u00a0\u00a0\u00a0\u00a0'}</span>`);
  const choicesHtml=d.choices.map((c,i)=>{
    let cls='';if(qz.done){if(i===d.correct_index)cls='ok';else if(i===qz.chosen)cls='ng';}
    return`<button class="choice ${cls}" id="ch${i}" onclick="answerQuiz(${i})" ${qz.done?'disabled':''}><span class="choice-txt">${c}</span>${spk(c,`spk-ch${i}`)}</button>`;
  }).join('');
  mc.innerHTML=`
    <div class="quiz-stat">${qz.score} / ${qz.total} correct</div>
    <div class="quiz-card">
      <div class="quiz-prompt">Choose the correct word:</div>
      <div class="quiz-sent jp">${sentHtml}</div>
      <div class="quiz-rd">${d.reading}</div>
      <div class="quiz-en">${d.english}</div>
    </div>
    <div class="choices">${choicesHtml}</div>
    <div class="quiz-fb ${qz.done?'show '+(qz.right?'ok':'ng'):''}" id="qfb">
      ${qz.done?(qz.right?'✓ Correct! ':'✗ Incorrect. ')+d.explanation:''}
    </div>
    ${qz.done?`<div style="display:flex;gap:7px;margin-top:.75rem;flex-wrap:wrap"><button class="btn" onclick="nextQuiz()">Next question →</button><button class="btn btn-red btn-sm" onclick="switchMode('build')">Try Build →</button></div>`:''}`;
}

function answerQuiz(i){
  if(qz.done)return;qz.done=true;qz.total++;qz.chosen=i;qz.right=i===qz.data.correct_index;
  if(qz.right){qz.score++;speak(qz.data.choices[i]);}
  renderQuiz();
}
function nextQuiz(){qz.data=null;qz.done=false;qz.chosen=-1;qz.right=false;loadAI('quiz');}

function renderBuild(){
  const mc=document.getElementById('mc');if(!mc)return;
  const d=bd.data;
  const ansHtml=bd.ans.length
    ?bd.ans.map(id=>{const t=bd.tiles.find(t=>t.id===id);return`<span class="tile in-ans jp" onclick="removeTile(${id})" title="${t?.reading||''}">${t?.jp}</span>`;}).join('')
    :`<span class="ans-ph">Tap words below to build the sentence…</span>`;
  const bankHtml=bd.tiles.map(t=>`<span class="tile jp ${t.used?'used':''}" onclick="addTile(${t.id})" title="${t.reading}">${t.jp}</span>`).join('');
  const fbHtml=bd.checked?`<div class="build-fb ${bd.correct?'ok':'ng'}">
    ${bd.correct?'✓ Correct! ':'✗ Not quite. Correct: '}
    <span class="jp">${d.full_japanese}</span><br>
    <span style="font-size:12px;opacity:.8;font-style:italic">${d.reading}</span><br>
    <span style="font-size:12.5px;margin-top:4px;display:block">${d.explanation}</span>
  </div>`:'';
  mc.innerHTML=`
    <div class="build-card">
      <div class="build-en">${d.english}</div>
      <div class="build-hint">Hint: ${d.hint}</div>
    </div>
    <p style="font-size:12px;color:var(--text3);margin-bottom:6px">Tap to add · tap again to remove:</p>
    <div class="ans-zone ${bd.checked?(bd.correct?'ok':'ng'):''}">${ansHtml}</div>
    <div class="word-bank">${bankHtml}</div>
    <div class="build-actions">
      <button class="btn btn-red" onclick="checkBuild()">Check</button>
      <button class="btn" onclick="clearBuild()">Clear</button>
      <button class="btn" onclick="newBuild()">New sentence →</button>
      ${bd.checked?spk(d.full_japanese,'spk-ans'):''}
    </div>
    ${fbHtml}`;
}

function addTile(id){if(bd.checked)return;const t=bd.tiles.find(t=>t.id===id);if(!t||t.used)return;t.used=true;bd.ans.push(id);renderBuild();}
function removeTile(id){if(bd.checked)return;const t=bd.tiles.find(t=>t.id===id);if(!t)return;t.used=false;bd.ans=bd.ans.filter(a=>a!==id);renderBuild();}
function clearBuild(){bd.tiles.forEach(t=>t.used=false);bd.ans=[];bd.checked=false;bd.correct=false;renderBuild();}
function checkBuild(){
  if(!bd.ans.length)return;
  const typed=bd.ans.map(id=>bd.tiles.find(t=>t.id===id)?.jp||'').join('');
  const correct=bd.data.correct_order.map(id=>bd.data.tiles.find(t=>t.id===id)?.jp||'').join('');
  bd.correct=typed===correct;bd.checked=true;
  if(bd.correct)speak(bd.data.full_japanese);
  renderBuild();
}
function newBuild(){bd={data:null,tiles:[],ans:[],checked:false,correct:false};loadAI('build');}

buildSidebar();
showWelcome();
</script>
